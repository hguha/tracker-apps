<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` makes env(safe-area-inset-*) report real numbers instead
         of zero, which is what .pt-safe/.pb-safe pad with. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="REPutation" />
    <!--
      Deliberately NO `apple-mobile-web-app-status-bar-style`. `black-translucent` moves
      an installed app's window up to draw under the status bar, but iOS still sizes it
      as if it started below — a window 62px shorter than the screen at y=0, so content
      hides under the Dynamic Island and a strip along the bottom sits outside the web
      view where no CSS can reach it. Without it, `display: standalone` from the manifest
      gives the ordinary geometry and the safe-area insets come out right on their own.
      iOS captures this at install, so it only changes on delete-and-re-add.
    -->
    <!-- Relative hrefs so they resolve under the /app/ base path. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <title>REPutation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
