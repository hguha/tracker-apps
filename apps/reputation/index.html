<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="REPutation" />
    <!--
      `default`, NOT `black-translucent`. Translucent makes an installed PWA draw
      under the status bar, and iOS reports safe-area-inset-top as 0 there, so
      pt-safe adds nothing and every screen sits too high. `default` lets iOS inset
      the web view below the status bar itself. This meta only applies to the
      home-screen PWA — the Capacitor shell uses the native status bar (see
      capacitor.config.ts + platform/statusBar), so native is unaffected.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Relative hrefs so they resolve under the /app/ base path. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <title>REPutation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
