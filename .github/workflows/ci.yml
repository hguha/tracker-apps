name: CI

# One workflow for the whole monorepo. It's small enough that running everything on
# every change is faster than the machinery to compute "what's affected" — add that
# (Turborepo/Nx caching, or path filters) only when build times start to hurt.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # recent LTS; dev runs 26, both build the same
          cache: npm
      - run: npm ci
      - name: Typecheck (all workspaces)
        run: npm run typecheck
      - name: Architecture + calc-consistency lint (every app)
        run: npm run lint
      - name: Tests (all workspaces)
        run: npm test
      - name: Build REPutation (web)
        run: npm run build
      - name: Build REPutation (native bundle)
        run: npm run build:native
      - name: Build MACROcosm (web)
        run: npm run build:macros
      - name: Build MACROcosm (native bundle)
        run: npm run build:native:macros
      - name: Build COINcidence (web)
        run: npm run build:ledger
      # The sites build here because they import from packages/site-kit: a change to the kit can
      # break a site without touching either site's files, which is exactly the failure CI is for.
      - name: Build the marketing sites
        run: npm run build:site && npm run build:site:macros
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install the Playwright system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: End-to-end (offline, every app)
        run: npm run test:e2e
      - name: Keep failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
