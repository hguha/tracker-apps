<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="REPutation">
  <!-- Maskable: keep the mark within the inner ~80% safe zone. -->
  <rect width="512" height="512" rx="112" fill="#2a78d6"/>
  <!-- A dumbbell: two plates on a bar, the REPutation mark. -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- bar -->
    <line x1="188" y1="256" x2="324" y2="256" stroke-width="28"/>
    <!-- left plates -->
    <line x1="168" y1="196" x2="168" y2="316" stroke-width="34"/>
    <line x1="124" y1="216" x2="124" y2="296" stroke-width="34"/>
    <!-- right plates -->
    <line x1="344" y1="196" x2="344" y2="316" stroke-width="34"/>
    <line x1="388" y1="216" x2="388" y2="296" stroke-width="34"/>
  </g>
</svg>
